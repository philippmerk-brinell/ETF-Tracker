signals:
  weights:
    drawdown:    0.25   # Drawdown from ATH (per-ETF)
    vix:         0.20   # VIX fear gauge (market-wide)
    hy_spread:   0.15   # HY credit spread (market-wide)
    rsi:         0.15   # RSI(14) oversold (per-ETF)
    fear_greed:  0.10   # CNN Fear & Greed (market-wide)
    sma200:      0.10   # Price vs 200-day SMA (per-ETF)
    yield_curve: 0.05   # 10Y-2Y yield curve (market-wide, context only)

  thresholds:
    elevated: 50   # ⚠️  Elevated — consider adding
    strong:   65   # 🚨  Strong buy signal
    extreme:  80   # 🔴  Extreme — rare opportunity


alerts:
  cooldowns:
    elevated: 24   # hours before re-alerting same level per ticker
    strong:   12
    extreme:  6

  webhook:
    enabled: true   # POST to MAKE_WEBHOOK_URL from .env


data:
  yfinance_period: "1y"   # period for price history; use "5y" for truer ATH
  sma_window: 200
  rsi_window: 14
